name: Android CI (main -> upload -> notify)

on:
  push:
    branches: ["main"]

concurrency:
  group: android-main
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build-upload-notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install tools (jq + yq)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Read version from pubspec.yaml
        run: |
          FULL=$(yq -r '.version' pubspec.yaml)
          NAME="${FULL%%+*}"
          NUM="${FULL#*+}"
          if [ "$NUM" = "$FULL" ]; then NUM=""; fi

          echo "PUBSPEC_VERSION_FULL=$FULL" >> $GITHUB_ENV
          echo "PUBSPEC_VERSION_NAME=$NAME" >> $GITHUB_ENV
          echo "PUBSPEC_BUILD_NUMBER=$NUM" >> $GITHUB_ENV

      - name: Create .env for build
        run: |
          cat > .env << 'EOF'
          MARQUER_API_URL=${{ vars.MARQUER_API_URL }}
          AUTH_API_URL=${{ vars.AUTH_API_URL }}
          EOF

      - name: Pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Configure S3 creds for Railway Bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> $GITHUB_ENV

      - name: Upload APK to Railway Bucket
        env:
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"

          # immutable + latest
          KEY_COMMIT="releases/android/commits/${GITHUB_SHA}/app-${PUBSPEC_VERSION_FULL}.apk"
          KEY_LATEST="releases/android/latest/app-latest.apk"

          aws s3 cp "$APK_PATH" "s3://${S3_BUCKET}/${KEY_COMMIT}" --endpoint-url "${S3_ENDPOINT}"
          aws s3 cp "$APK_PATH" "s3://${S3_BUCKET}/${KEY_LATEST}" --endpoint-url "${S3_ENDPOINT}"

          echo "APK_KEY_COMMIT=${KEY_COMMIT}" >> $GITHUB_ENV
          echo "APK_KEY_LATEST=${KEY_LATEST}" >> $GITHUB_ENV

      - name: Mint GitHub OIDC token (audience=laravel)
        env:
          AUDIENCE: "api://marquer-backend"
        run: |
          RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")  # GitHub OIDC reference [web:90]
          TOKEN=$(echo "$RESP" | jq -r '.value')
          test "$TOKEN" != "null"
          echo "OIDC_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Notify Laravel (create release record)
        env:
          URL: ${{ vars.BACKEND_NOTIFY_URL }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          BODY=$(jq -n \
            --arg platform "android" \
            --arg channel "stable" \
            --arg version "$PUBSPEC_VERSION_NAME" \
            --arg build_number "$PUBSPEC_BUILD_NUMBER" \
            --arg version_full "$PUBSPEC_VERSION_FULL" \
            --arg git_sha "$GITHUB_SHA" \
            --arg bucket "$S3_BUCKET" \
            --arg endpoint "$S3_ENDPOINT" \
            --arg key_latest "$APK_KEY_LATEST" \
            --arg key_commit "$APK_KEY_COMMIT" \
            '{
              platform:$platform,
              channel:$channel,
              version:$version,
              build_number:$build_number,
              version_full:$version_full,
              git_sha:$git_sha,
              bucket:$bucket,
              endpoint:$endpoint,
              key_latest:$key_latest,
              key_commit:$key_commit
            }')

          curl -sS -X POST "$URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$BODY"
