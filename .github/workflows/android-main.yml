name: Android CI (main -> upload -> notify)

on:
  push:
    branches: ["main"]

concurrency:
  group: android-main
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  pull-requests: read

jobs:
  build-upload-notify:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install tools (jq + yq)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Read version from pubspec.yaml
        run: |
          FULL=$(yq -r '.version' pubspec.yaml)
          NAME="${FULL%%+*}"
          NUM="${FULL#*+}"
          if [ "$NUM" = "$FULL" ]; then NUM=""; fi

          echo "PUBSPEC_VERSION_FULL=$FULL" >> $GITHUB_ENV
          echo "PUBSPEC_VERSION_NAME=$NAME" >> $GITHUB_ENV
          echo "PUBSPEC_BUILD_NUMBER=$NUM" >> $GITHUB_ENV

      - name: Check if version tag already exists
        run: |
          git fetch --tags --quiet
          TAG="v${PUBSPEC_VERSION_NAME}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping release"
            echo "SKIP_RELEASE=true" >> $GITHUB_ENV
          else
            echo "Tag $TAG not found — proceeding with release"
            echo "SKIP_RELEASE=false" >> $GITHUB_ENV
          fi

      - name: Create .env for build
        if: env.SKIP_RELEASE != 'true'
        run: |
          cat > .env << 'EOF'
          MARQUER_API_URL=${{ vars.MARQUER_API_URL }}
          AUTH_API_URL=${{ vars.AUTH_API_URL }}
          GLITCHTIP_DSN=${{ vars.GLITCHTIP_DSN }}
          EOF

      - name: Decode keystore
        if: env.SKIP_RELEASE != 'true'
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        if: env.SKIP_RELEASE != 'true'
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=./upload-keystore.jks
          EOF

      - name: Pub get
        if: env.SKIP_RELEASE != 'true'
        run: flutter pub get

      - name: Gradle cache (cache-only)
        if: env.SKIP_RELEASE != 'true'
        uses: burrunan/gradle-cache-action@v3

      - name: Build release APK
        if: env.SKIP_RELEASE != 'true'
        run: flutter build apk --release

      - name: Configure S3 creds for Railway Bucket
        if: env.SKIP_RELEASE != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> $GITHUB_ENV

      - name: Upload APK to Railway Bucket
        if: env.SKIP_RELEASE != 'true'
        env:
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"

          # immutable + latest
          KEY_COMMIT="releases/android/commits/${GITHUB_SHA}/app-${PUBSPEC_VERSION_FULL}.apk"
          KEY_LATEST="releases/android/latest/app-latest.apk"

          aws s3 cp "$APK_PATH" "s3://${S3_BUCKET}/${KEY_COMMIT}" --endpoint-url "${S3_ENDPOINT}"
          aws s3 cp "$APK_PATH" "s3://${S3_BUCKET}/${KEY_LATEST}" --endpoint-url "${S3_ENDPOINT}"

          echo "APK_KEY_COMMIT=${KEY_COMMIT}" >> $GITHUB_ENV
          echo "APK_KEY_LATEST=${KEY_LATEST}" >> $GITHUB_ENV

      - name: Mint GitHub OIDC token (audience=laravel)
        if: env.SKIP_RELEASE != 'true'
        env:
          AUDIENCE: "api://marquer-backend"
        run: |
          RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")  # GitHub OIDC reference [web:90]
          TOKEN=$(echo "$RESP" | jq -r '.value')
          test "$TOKEN" != "null"
          echo "OIDC_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Generate changelog
        if: env.SKIP_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${PUBSPEC_VERSION_NAME}"

          # Find the most recent previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)

          if [ -z "$PREV_TAG" ]; then
            echo "CHANGELOG=Initial release" >> $GITHUB_ENV
          else
            # Collect merged PR titles between PREV_TAG and HEAD
            RANGE="${PREV_TAG}..HEAD"
            SHAS=$(git log "$RANGE" --format="%H")

            FEAT_LINES=""
            HAS_GENERIC=false

            while IFS= read -r sha; do
              [ -z "$sha" ] && continue
              # Get PR title for this commit (first associated PR)
              PR_TITLE=$(gh api "repos/${{ github.repository }}/commits/${sha}/pulls" \
                --jq '.[0].title // empty' 2>/dev/null || true)
              [ -z "$PR_TITLE" ] && continue

              PREFIX=$(echo "$PR_TITLE" | sed 's/: .*//')
              DESC=$(echo "$PR_TITLE" | sed 's/^[^:]*: //')
              # Capitalize first letter
              DESC="$(echo "${DESC:0:1}" | tr '[:lower:]' '[:upper:]')${DESC:1}"

              case "$PREFIX" in
                feat|fix|hotfix)
                  FEAT_LINES="${FEAT_LINES}• ${DESC}"$'\n'
                  ;;
                chore|refactor|docs|test|bump)
                  HAS_GENERIC=true
                  ;;
              esac
            done <<< "$SHAS"

            # Deduplicate feat lines
            FEAT_LINES=$(echo "$FEAT_LINES" | sort -u)

            BODY=""
            if [ -n "$FEAT_LINES" ]; then
              BODY="${FEAT_LINES}"
            fi
            if [ "$HAS_GENERIC" = true ]; then
              BODY="${BODY}• Performance improvements and minor bug fixes"$'\n'
            fi

            if [ -z "$BODY" ]; then
              BODY="Performance improvements and minor bug fixes"
            fi

            # Write multiline value to GITHUB_ENV
            {
              echo "CHANGELOG<<EOF_CHANGELOG"
              echo "$BODY"
              echo "EOF_CHANGELOG"
            } >> $GITHUB_ENV
          fi

      - name: Notify Laravel (create release record)
        if: env.SKIP_RELEASE != 'true'
        env:
          URL: ${{ vars.BACKEND_NOTIFY_URL }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          BASE=$(jq -n \
            --arg platform "android" \
            --arg channel "stable" \
            --arg version "$PUBSPEC_VERSION_NAME" \
            --arg build_number "$PUBSPEC_BUILD_NUMBER" \
            --arg version_full "$PUBSPEC_VERSION_FULL" \
            --arg git_sha "$GITHUB_SHA" \
            --arg bucket "$S3_BUCKET" \
            --arg endpoint "$S3_ENDPOINT" \
            --arg key_latest "$APK_KEY_LATEST" \
            --arg key_commit "$APK_KEY_COMMIT" \
            '{
              platform:$platform,
              channel:$channel,
              version:$version,
              build_number:$build_number,
              version_full:$version_full,
              git_sha:$git_sha,
              bucket:$bucket,
              endpoint:$endpoint,
              key_latest:$key_latest,
              key_commit:$key_commit
            }')

          if [ -n "$CHANGELOG" ]; then
            BODY=$(echo "$BASE" | jq --arg changelog "$CHANGELOG" '. + {changelog:$changelog}')
          else
            BODY="$BASE"
          fi

          curl -sS -X POST "$URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$BODY"

      - name: Create git tag
        if: env.SKIP_RELEASE != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${PUBSPEC_VERSION_NAME}"
          git push origin "v${PUBSPEC_VERSION_NAME}"
